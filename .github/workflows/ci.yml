name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: build & test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      # vitest transpiles without type-checking, so `npm test` alone gives a
      # signature change no compile-time net: a missed call site runs happily and
      # silently returns the wrong shape. Runs before the build so a type error
      # fails fast.
      - run: npm run typecheck
      - run: npm run build
      # `dist/` is TRACKED and shipped, so an install needs no build toolchain —
      # which means a PR that edits `src/` without rebuilding ships a stale
      # binary while CI stays green. `verify:dist` rebuilds and diffs against the
      # committed copy.
      #
      # ONE cell only: the bundle is not byte-reproducible across OSes, so
      # running this on all six would fail on differences that mean nothing.
      # ubuntu/node 22 is the cheapest deterministic cell.
      - run: npm run verify:dist
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
      - run: npm test
        # T0.a: the bash lint's `bash -n` gate must FAIL (not silently skip) if a
        # runner lacks bash. All three runners ship bash (Git Bash on Windows).
        env:
          RSCT_REQUIRE_BASH: '1'
